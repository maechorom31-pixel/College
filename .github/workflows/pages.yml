name: Deploy to GitHub Pages

# 기본 브랜치에 푸시되면 정적 사이트를 그대로 GitHub Pages 로 배포한다.
# 빌드 단계가 없다 — 의존성 없는 HTML/CSS/JS + data/*.json 을 그대로 올린다.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write          # configure-pages 가 Pages 를 자동으로 켤 때 필요
  id-token: write       # deploy-pages 의 OIDC 인증

# 배포는 겹치지 않게. 진행 중인 배포를 중간에 끊지는 않는다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # 기본 브랜치가 나중에 바뀌어도 따라가도록 이름을 박지 않는다
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Pages 설정 (꺼져 있으면 켜기)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: 데이터 파일 점검
        run: |
          for f in meta colleges departments admissions jeongsi dept_info extras univ; do
            python3 -c "import json;d=json.load(open('data/$f.json'));print(f'  data/$f.json  항목 {len(d)}')"
          done

      - name: 사이트 업로드
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: 배포
        id: deploy
        uses: actions/deploy-pages@v4
