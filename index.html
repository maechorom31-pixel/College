<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>전문대 진학 탐색 · 2027 입시</title>
<meta name="description" content="전국 전문대학을 지도와 조건으로 탐색하고 입결·취업률을 한눈에 비교하세요.">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="#/">
      <span class="brand-mark">🎓</span>
      <span class="brand-text">전문대 진학 탐색<small>2027 입시 자료 기반</small></span>
    </a>
    <div class="global-search">
      <input id="globalSearch" type="search" placeholder="대학·학과 검색 (예: 간호, 동양미래대)" autocomplete="off">
    </div>
  </div>
</header>

<main class="wrap" id="view"><!-- 뷰가 렌더링되는 영역 --></main>

<footer class="site-footer">
  <div class="wrap">
    <p>출처: 2027학년도 전국 전문대학 입시 자료집 · 입결/취업률 등은 미발표 시 "정보 없음"으로 표시됩니다.</p>
    <p class="muted">학습·참고용 탐색 도구이며, 최종 지원 전 반드시 각 대학 모집요강을 확인하세요.</p>
  </div>
</footer>

<!-- 장바구니(비교함) 바 -->
<div id="cartBar" class="cart-bar hidden">
  <span class="cart-info"><b id="cartCount">0</b>개 담음</span>
  <button id="cartOpen" class="cart-btn">비교하기</button>
  <button id="cartClear" class="cart-clear" aria-label="비우기">비우기</button>
</div>

<script src="js/koreaGeo.js"></script>
<script src="js/charts.js"></script>
<script src="js/koreaMap.js"></script>
<script src="js/app.js"></script>
</body>
</html>
